# The public archives of every build variant, as workflow artifacts (each
# the .tar.gz itself, not a zip around it):
# out/nolf2-{legacy,modern}-{release,debug}-public.tar.gz (build/package.sh),
# the game directory without anything from the retail game, with the
# scripts that install that from the player's own disc images and 1.3
# update (tools/mkinstall.py). The -private archives, which hold the retail
# data, are not made here. The release build is also checked for byte
# regressions (make progress).
#
# The build needs, from archive.org, the redump zips of the European discs
# (the retail game, `make retail` installs it from them and the 1.3 update
# rez/ carries), of the USA discs (the install scripts are made against
# both releases') and the LithTech Jupiter SDK's CD image (`make sdk`,
# ServerDir.dll's source): 2.9 GB, checked against rez/isos/SHA256SUMS. The
# job "prepare" fetches them once, into a cache keyed on that file, and
# builds the docker image into a layer cache; then the four builds run at
# the same time, each in a job of its own that restores both. None of the
# builds needs another's output.
#
# Pushing a tag (v*, e.g. v0.1.0-alpha) also makes a GitHub release of it,
# with the modern build's public archives attached (the job "release"),
# named for the tag: nolf2-modern-release-public.tar.gz as
# nolf2src-<tag>.tar.gz and nolf2-modern-debug-public.tar.gz as
# nolf2src-debug-<tag>.tar.gz, each repacked to unpack to a directory of
# that name. The legacy build is not attached. A tag with a hyphen in it is
# marked a pre-release. A release of that tag made by hand beforehand is
# kept, with its text; the archives are added to it, replacing ones of the
# same name. A new release's text is .github/release-notes.md, followed by
# GitHub's generated list of changes.
name: Public archives

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: public-archives-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      discs-key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      # .gitmodules names the submodules by SSH; all of them are public, so
      # fetch them over HTTPS instead, at the commit this one records. Only
      # rez/ (the disc list and fetch-isos.sh) is needed here.
      - name: Submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync
          git submodule update --init --depth 1 rez

      # hashFiles() sees only the checkout, so the key is made once the
      # submodule is there, and handed to the builds.
      - name: Cache key
        id: key
        run: echo "key=redump-nolf2-eu-usa-jupiter-$(sha256sum rez/isos/SHA256SUMS | cut -c1-64)" >> "$GITHUB_OUTPUT"

      # Only whether the cache has them: nothing is downloaded on a hit.
      - name: Look for the disc images
        id: discs
        uses: actions/cache/restore@v4
        with:
          path: |
            rez/isos/*.zip
            rez/isos/sdk/LithEngine.iso
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      # Checked against SHA256SUMS before it is saved.
      - name: Fetch the disc images
        if: steps.discs.outputs.cache-hit != 'true'
        run: rez/fetch-isos.sh nolf2-eu-1.3 nolf2-usa lithtech-jupiter-51

      - name: Save the disc images
        if: steps.discs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            rez/isos/*.zip
            rez/isos/sdk/LithEngine.iso
          key: ${{ steps.key.outputs.key }}

      # Written to the layer cache here, once; the builds only read it.
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: docker
          tags: nolf2src-build
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false         # one build failing still lets the others finish
      matrix:
        include:
          - name: nolf2-legacy-release
            target: all
          - name: nolf2-legacy-debug
            target: debug
          - name: nolf2-modern-release
            target: modern
          - name: nolf2-modern-debug
            target: modern-debug
    name: ${{ matrix.name }}
    env:
      NOLF2_ARCHIVES: public
      IMAGE_BUILD: 0           # the step "Build image" loads it, cached
    steps:
      # The runner's preinstalled SDKs we never use: about 30 GB, where a
      # build needs about 14 (the image, the discs and the retail game, a
      # game directory and its build tree).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v4

      # tools/ (the build's scripts), toolchains/ (the compilers, the
      # DirectX 8.1 SDK), rez/ (the discs'
      # installer and the 1.3 update) and ext/ffmpeg (the modern build's
      # Bink player).
      - name: Submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync
          git submodule update --init --depth 1 --jobs 4

      - name: Restore the disc images
        uses: actions/cache/restore@v4
        with:
          path: |
            rez/isos/*.zip
            rez/isos/sdk/LithEngine.iso
          key: ${{ needs.prepare.outputs.discs-key }}
          fail-on-cache-miss: true

      # Loaded as nolf2src-build, which the Makefile then uses (IMAGE_BUILD=0).
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: docker
          tags: nolf2src-build
          load: true
          cache-from: type=gha

      # Checks the zips against SHA256SUMS, converts them to .iso, then
      # installs the retail game and the SDK's source.
      - name: Install the retail game and the Jupiter SDK
        run: make retail sdk

      - name: Build ${{ matrix.name }}
        run: make ${{ matrix.target }}

      # The release build scored against the retail binaries: fails if a
      # function recorded in progress/identical.txt is no longer
      # byte-identical (build/progress.sh).
      - name: Byte regressions (make progress)
        if: matrix.name == 'nolf2-legacy-release'
        run: make progress

      # Uploaded as the .tar.gz itself (archive: false), not zipped again;
      # the artifact takes the file's name.
      - uses: actions/upload-artifact@v7
        with:
          path: out/${{ matrix.name }}-public.tar.gz
          archive: false
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write          # create the release and upload to it
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
          sparse-checkout-cone-mode: false

      # Each by its name: the build jobs upload the .tar.gz itself
      # (archive: false), which download-artifact reads from v8 on.
      - uses: actions/download-artifact@v8
        with:
          name: nolf2-modern-release-public.tar.gz
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: nolf2-modern-debug-public.tar.gz
          path: dist

      - name: Release ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          find dist -type f -ls
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            pre=; case "$TAG" in *-*) pre=--prerelease ;; esac
            sed -e "s|{{TAG}}|$TAG|g" -e "s|{{REPO}}|$GH_REPO|g" \
                .github/release-notes.md | sed '/^<!--/,/^-->/d' > notes.md
            gh release create "$TAG" --verify-tag --notes-file notes.md \
                --generate-notes $pre --title "$TAG"
          fi
          # Repacked so that each unpacks to a directory of its own name,
          # not the build's nolf2-modern-release/ or nolf2-modern-debug/.
          repack() {   # <build name> <release name>
            rm -rf x && mkdir x
            tar -C x -xzpf "$(find dist -name "$1-public.tar.gz")"
            mv "x/$1" "x/$2"
            tar -C x -cf - "$2" | gzip -6 > "up/$2.tar.gz"
          }
          mkdir up
          repack nolf2-modern-release "nolf2src-$TAG"
          repack nolf2-modern-debug "nolf2src-debug-$TAG"
          for f in up/*.tar.gz; do echo "$f: $(tar -tzf "$f" | head -1)"; done
          gh release upload "$TAG" up/*.tar.gz --clobber
